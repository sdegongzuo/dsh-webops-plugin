<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>操作效果</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}
#wash{position:absolute;inset:0;opacity:0;background:#5594fa12;box-shadow:inset 0 0 80px #5594fa66,inset 0 0 0 3px #5594fa77}
#wash.controlled{opacity:1}
/* 仅记录操作坐标供诊断，不绘制鼠标、水波纹或动画。 */
#cursor{position:absolute;left:0;top:0}
</style>
<div id="wash" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"></div>
<script>
const cursor=document.getElementById('cursor')
cursor.hidden=true
window.setAgentControl=active=>{document.getElementById('wash').className=active?'controlled':'';if(!active)cursor.hidden=true}
window.clearAction=()=>{cursor.hidden=true}
window.projectAction=({x,y,phase,sequence})=>{
  cursor.hidden=false
  cursor.style.left=`${x}%`;cursor.style.top=`${y}%`
  cursor.className='';cursor.dataset.sequence=String(sequence)
  cursor.className=phase
}
</script></html>
