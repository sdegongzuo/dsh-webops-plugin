<!doctype html>
<!--
  标签栏页面：由窗口宿主（`host.cjs`）加载进壳窗口的主 `webContents`。
  它只负责画标签条，并把点击翻译成 IPC；真正的窗口逻辑全在主进程。

  与宿主之间只有两个约定：
  - 主进程 `webContents.send('dsh-tabs', tabs)` → 这里重画。
  - 这里 `window.dshTabBar.{select,close,create}(id)` → 主进程的 `ipcMain`。

  样式跟随系统深/浅色（`prefers-color-scheme`），不引任何外部资源。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #f2f3f5;
    --bg-active: #ffffff;
    --fg: #1f2329;
    --fg-dim: #646a73;
    --line: #dee0e3;
    --accent: #3370ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #232324;
      --bg-active: #2f3031;
      --fg: #e6e6e6;
      --fg-dim: #9a9a9a;
      --line: #3a3b3c;
      --accent: #6f9bff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #bar {
    display: flex; align-items: center; gap: 4px;
    height: 100%; padding: 0 6px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 220px; min-width: 90px; height: 28px; padding: 0 6px 0 10px;
    border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--fg-dim);
    white-space: nowrap; overflow: hidden;
  }
  .tab:hover { background: rgba(127,127,127,0.14); }
  .tab[data-active="1"] {
    background: var(--bg-active); color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tab .title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .tab .x {
    flex: 0 0 auto; width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 4px; color: var(--fg-dim); font-size: 14px;
  }
  .tab .x:hover { background: rgba(127,127,127,0.28); color: var(--fg); }
  #new {
    flex: 0 0 auto; width: 26px; height: 26px; margin-left: 2px;
    border: 0; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--fg-dim); font-size: 16px; line-height: 24px;
  }
  #new:hover { background: rgba(127,127,127,0.14); color: var(--fg); }
  #hint {
    margin-left: auto; padding-right: 6px;
    color: var(--fg-dim); font-size: 12px; opacity: 0.75;
  }
</style>
</head>
<body>
  <div id="bar">
    <button id="new" title="新建标签页">+</button>
    <span id="hint"></span>
  </div>
<script>
  const bar = document.getElementById('bar')
  const hint = document.getElementById('hint')
  document.getElementById('new').addEventListener('click', () => {
    window.dshTabBar?.create()
  })

  function render(tabs) {
    bar.querySelectorAll('.tab').forEach(node => node.remove())
    for (const tab of tabs) {
      const node = document.createElement('div')
      node.className = 'tab'
      node.dataset.active = tab.active ? '1' : '0'
      node.title = tab.url ?? ''

      const title = document.createElement('span')
      title.className = 'title'
      title.textContent = tab.title === '' ? '新标签页' : tab.title
      node.appendChild(title)

      const close = document.createElement('span')
      close.className = 'x'
      close.textContent = '×'
      close.addEventListener('click', (event) => {
        // 别让点击冒泡到标签的「切换」上。
        event.stopPropagation()
        window.dshTabBar?.close(tab.id)
      })
      node.appendChild(close)

      node.addEventListener('click', () => { window.dshTabBar?.select(tab.id) })
      bar.insertBefore(node, hint)
    }
    hint.textContent = tabs.length === 0 ? '（没有打开的标签页）' : ''
  }

  window.dshTabBar?.onTabs(render)
</script>
</body>
</html>
