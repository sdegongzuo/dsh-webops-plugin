<!doctype html>
<!--
  标签栏页面：由窗口宿主（`host.cjs`）加载进壳窗口的主 `webContents`。
  它只负责画标签条，并把点击翻译成 IPC；真正的窗口逻辑全在主进程。

  与宿主之间只有两个约定：
  - 主进程 `webContents.send('dsh-tabs', tabs)` → 这里重画标签行；
    主进程 `webContents.send('dsh-nav-state', { url, canGoBack, canForward })` → 这里同步地址栏。
  - 这里 `window.dshTabBar.{select,close,create}(id)` 与
    `window.dshTabBar.nav(action, url?)` → 主进程的 `ipcMain`。

  样式跟随系统深/浅色（`prefers-color-scheme`），不引任何外部资源。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #f2f3f5;
    --bg-active: #ffffff;
    --fg: #1f2329;
    --fg-dim: #646a73;
    --line: #dee0e3;
    --accent: #3370ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #232324;
      --bg-active: #2f3031;
      --fg: #e6e6e6;
      --fg-dim: #9a9a9a;
      --line: #3a3b3c;
      --accent: #6f9bff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  body { display: flex; flex-direction: column; }
  #bar {
    display: flex; align-items: center; gap: 4px;
    flex: 0 0 40px; height: 40px; padding: 0 6px;
    border-bottom: 1px solid var(--line);
  }
  #navbar {
    display: flex; align-items: center; gap: 4px;
    flex: 0 0 36px; height: 36px; padding: 0 6px;
    border-bottom: 1px solid var(--line);
  }
  #navbar button {
    flex: 0 0 auto; width: 26px; height: 26px;
    border: 0; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--fg-dim); font-size: 14px; line-height: 24px;
    padding: 0;
  }
  #navbar button:hover:not(:disabled) { background: rgba(127,127,127,0.14); color: var(--fg); }
  #navbar button:disabled { opacity: 0.35; cursor: default; }
  #url {
    flex: 1 1 auto; min-width: 0; height: 24px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg-active); color: var(--fg);
    font: inherit; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  #url:focus { border-color: var(--accent); }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 220px; min-width: 90px; height: 28px; padding: 0 6px 0 10px;
    border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--fg-dim);
    white-space: nowrap; overflow: hidden;
  }
  .tab:hover { background: rgba(127,127,127,0.14); }
  .tab[data-active="1"] {
    background: var(--bg-active); color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tab .title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .tab .x {
    flex: 0 0 auto; width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 4px; color: var(--fg-dim); font-size: 14px;
  }
  .tab .x:hover { background: rgba(127,127,127,0.28); color: var(--fg); }
  #new {
    flex: 0 0 auto; width: 26px; height: 26px; margin-left: 2px;
    border: 0; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--fg-dim); font-size: 16px; line-height: 24px;
  }
  #new:hover { background: rgba(127,127,127,0.14); color: var(--fg); }
  #hint {
    margin-left: auto; padding-right: 6px;
    color: var(--fg-dim); font-size: 12px; opacity: 0.75;
  }
  /* —— 控制权（§6.5）——
     状态文字与按钮都放在标签行右端。按钮**不做乐观更新**（见 preload 的注释）：
     点完等主进程推回状态，所以这里没有任何 `:active` 之类的即时反馈样式，
     唯一会变的是 `data-holder`，而它只由主进程的消息驱动。 */
  #holder {
    flex: 0 0 auto; padding: 0 8px 0 2px;
    color: var(--fg-dim); font-size: 12px; white-space: nowrap;
  }
  #holder[data-holder="human"] { color: var(--accent); font-weight: 600; }
  #control {
    flex: 0 0 auto; height: 24px; margin-right: 6px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    background: var(--bg-active); color: var(--fg); font: inherit; white-space: nowrap;
  }
  #control:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #control[data-holder="human"] {
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  #control:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <div id="bar">
    <button id="new" title="新建标签页">+</button>
    <span id="hint"></span>
    <span id="holder"></span>
    <button id="control" type="button" disabled></button>
  </div>
  <div id="navbar">
    <button id="back" title="后退">←</button>
    <button id="forward" title="前进">→</button>
    <button id="reload" title="刷新">⟳</button>
    <input id="url" type="text" spellcheck="false" placeholder="输入网址，回车跳转" />
  </div>
<script>
  const bar = document.getElementById('bar')
  const hint = document.getElementById('hint')
  const urlInput = document.getElementById('url')
  const navBack = document.getElementById('back')
  const navForward = document.getElementById('forward')
  const navReload = document.getElementById('reload')
  document.getElementById('new').addEventListener('click', () => {
    window.dshTabBar?.create()
  })

  function render(tabs) {
    bar.querySelectorAll('.tab').forEach(node => node.remove())
    for (const tab of tabs) {
      const node = document.createElement('div')
      node.className = 'tab'
      node.dataset.active = tab.active ? '1' : '0'
      node.title = tab.url ?? ''

      const title = document.createElement('span')
      title.className = 'title'
      title.textContent = tab.title === '' ? '新标签页' : tab.title
      node.appendChild(title)

      const close = document.createElement('span')
      close.className = 'x'
      close.textContent = '×'
      close.addEventListener('click', (event) => {
        // 别让点击冒泡到标签的「切换」上。
        event.stopPropagation()
        window.dshTabBar?.close(tab.id)
      })
      node.appendChild(close)

      node.addEventListener('click', () => { window.dshTabBar?.select(tab.id) })
      bar.insertBefore(node, hint)
    }
    hint.textContent = tabs.length === 0 ? '（没有打开的标签页）' : ''
  }

  window.dshTabBar?.onTabs(render)

  // 地址栏状态：输入框没有聚焦时才跟随 url 更新（用户正在手动输入时别抢内容），
  // 前进/后退按钮的 disabled 跟随 canGoBack / canForward（没有历史就置灰）。
  window.dshTabBar?.onNavState((state) => {
    if (document.activeElement !== urlInput) urlInput.value = state.url
    navBack.disabled = !state.canGoBack
    navForward.disabled = !state.canForward
  })

  // —— 控制权（§6.5）——
  // J7：按钮**任何时刻**都能按 —— 它挂在独立的标签条 view 上（`host.cjs` 的 `tabBar`），
  // 不经过 agent、也不需要它同意，所以「人永远不会被锁在外面」是结构上成立的，不靠约定。
  //
  // 文案只说**归属**，不出现「已隔离 / 安全」这类话（方案 §6.5 代价 3：这个按钮拦不住
  // 人工开 DevTools 改 DOM、换浏览器、用手机操作，说了就是骗人）。
  const holderLabel = document.getElementById('holder')
  const controlButton = document.getElementById('control')
  let control = { tabId: '', holder: 'agent' }

  function renderControl(state) {
    control = { tabId: state.tabId ?? '', holder: state.holder === 'human' ? 'human' : 'agent' }
    const human = control.holder === 'human'
    const hasTab = control.tabId !== ''
    holderLabel.textContent = hasTab ? (human ? '现在轮到你了' : '现在由 agent 操作') : ''
    holderLabel.dataset.holder = control.holder
    controlButton.textContent = human ? '交还' : '接管'
    controlButton.dataset.holder = control.holder
    // 唯一会置灰的情形：没有前台标签，没什么可接管。
    controlButton.disabled = !hasTab
    controlButton.title = human
      ? '交还：把页面还给 agent。它需要重新拍一次快照才能继续操作 —— 接管期间作废的 ref 不会恢复。'
      : '接管：把页面交给你自己操作。当前由 agent 控制，你在页面里的键盘输入暂时不生效（鼠标不受限）。'
  }

  window.dshTabBar?.onControlState(renderControl)

  controlButton.addEventListener('click', () => {
    if (control.tabId === '') return
    // 只发指令，**不在这里改 UI** —— 等主进程把真实状态推回来（见 preload 的注释：
    // 乐观更新会在切换失败时让界面说谎，而「现在到底归谁」正是这个功能唯一的输出）。
    window.dshTabBar?.control(control.holder === 'human' ? 'hand' : 'take')
  })

  // 回车 = 导航：trim 后不含 `://` 就补 `https://`；空串忽略；导航后让输入框失焦。
  urlInput.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return
    const raw = urlInput.value.trim()
    if (raw === '') return
    const target = raw.includes('://') ? raw : `https://${raw}`
    window.dshTabBar?.nav('navigate', target)
    urlInput.blur()
  })
  navBack.addEventListener('click', () => { window.dshTabBar?.nav('back') })
  navForward.addEventListener('click', () => { window.dshTabBar?.nav('forward') })
  navReload.addEventListener('click', () => { window.dshTabBar?.nav('reload') })
</script>
</body>
</html>
