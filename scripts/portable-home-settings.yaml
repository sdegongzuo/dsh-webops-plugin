# 便携包出厂 settings.yaml —— 由 scripts/package-desktop-portable.mjs 写进 home/。
#
# 只预置云知声 MaaS 一个 provider：便携版的 home\ 是全新的，别的 provider 没有凭据也
# 用不起来。API Key 不进包（`apiKeyEnv` 只是凭据引用名），由用户在
# 「设置 → 模型」里填，落到 home\.credentials.yaml。
#
# 平台：https://maas.unisound.com  文档：https://maas.unisound.com/docs/guide/overview
# base_url 与 OpenAI 完全兼容（/v1/chat/completions），故 api 取 openai-completions。

agent-default-model:
  provider: unisound
  model: u2-flash

llm-pi-ai:
  providers:
    unisound:
      # 凭据引用名，不是 key 本身。用户填的 key 存进 home\.credentials.yaml。
      apiKeyEnv: UNISOUND_API_KEY
      displayName: 云知声 MaaS
      api: openai-completions
      baseURL: https://maas-api.unisound.com/v1
      # 只列文本对话模型。同平台的 TTS / ASR / OCR / 医疗影像模型不吃这套
      # chat 协议（走各自的 /docs/api/… 端点），列进来只会让模型选择器出现选不动的项。
      # contextWindow 取自官方模型广场标注；maxTokens 故意不写，走 dsh 默认的 32768
      # —— 输出上限设错会让请求被服务端拒掉，而这里没法离线核实每个模型的真实上限。
      models:
        - id: u2-flash
          name: U2 Flash
          contextWindow: 524288
        - id: u2
          name: Unisound U2
          contextWindow: 163840
        - id: deepseek-v4-flash-0731
          name: DeepSeek V4 Flash 0731
          contextWindow: 1048576
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1048576
        - id: kimi-k2.5
          name: Kimi K2.5
          contextWindow: 262144
        - id: kimi-k2.6
          name: Kimi K2.6
          contextWindow: 262144
        - id: kimi-k3
          name: Kimi K3
          contextWindow: 1048576
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          contextWindow: 1048576
        - id: glm-5.2
          name: GLM-5.2
          contextWindow: 1048576
        - id: glm-5.1
          name: GLM-5.1
          contextWindow: 206848
        - id: glm-5
          name: GLM-5
          contextWindow: 206848
        - id: MiniMax-M2.5
          name: MiniMax M2.5
          contextWindow: 208896
        - id: qwen3.8-max
          name: Qwen3.8-Max
          contextWindow: 1048576
        - id: qwen3.7-max
          name: Qwen3.7-Max
          contextWindow: 1048576
        - id: qwen3.7-plus
          name: Qwen3.7-Plus
          contextWindow: 262144
        - id: qwen3.6-plus
          name: Qwen3.6-Plus
          contextWindow: 262144
        - id: qwen3.6-flash
          name: Qwen3.6-Flash
          contextWindow: 262144
        - id: qwen3.6-35b-a3b
          name: Qwen3.6-35B-A3B
          contextWindow: 262144
