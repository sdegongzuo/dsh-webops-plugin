# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# ↑ 三行是 dsh 自己的出厂表头（`packages/boot/app-boot/src/profile.ts` 的 PROFILE_PATCH_TEMPLATE），
#   保持逐字一致，用户看到的就是同一份文件该有的样子；下面才是我们预置的内容。
#
# 便携包出厂配置 —— 由 scripts/package-desktop-portable.mjs 复制成
#   <便携包根>/home/profiles/desktop/cordis.patch.yml
#
# 不预置任何模型 provider：便携版的 home\ 是全新的，没有凭据，预置了也用不起来。
# 用户在「设置 → 模型」里添加自己的模型提供商（OpenAI 兼容网关 / xAI / DeepSeek 等）
# 并填入 API Key，落到 home\.credentials.yaml。API Key 不进包。
#
# ⚠️ 为什么写在这里、而不是 `home/settings.yaml`（2026-09-24 适配 dsh 0.1.7）：
#   0.1.7 起 `settings.yaml` 已被上游**退役**——`packages/settings/settings/src/index.ts` 的
#   `importLegacyDocument()` 只在启动时把它**一次性**导入本 profile 然后改名成
#   `.imported`（源码注释原话是「the **removed** `settings.yaml`」）。设置现在的家就是
#   这份 profile patch（`configEditor.documentPath` = `profileContext.patchPath`），
#   用户在「设置」页里的每一次改动也写在这里。出厂配置直接写在终点，就不必再依赖一个
#   上游明确标为「已移除」的迁移垫片。
#
# 这一段能不能被 dsh 接受**只能真跑**（字段名写错不会报错，整段会被静默丢掉 →
# 用户装完包权限默认不符）。判据：`node scripts/verify-settings.mjs`。

# 出厂默认权限 = 自动审查（实验）。
#
# 为什么要整块重述 presets：Loader 的 patch 命中一行时 **config 是整块替换、不深合并**
# （vendor/include/src/index.ts 的 `target[key] = value`；`--dump-config` 文档同口径）。
# 只写 defaultPreset 会把 base 层的 presets 表冲掉，回落到 schema 默认的两项 ——
# 设置页的「仅可查看」会消失。所以这里必须把三项原样带上。
#
# `auto` 只有在 @deepseek-ai/dsh-experimental-auto-review 这一层活着时才是可选/可作默认；
# 集成不在时宿主回落为推导默认（工作区内修改），设置页也不会报错（桌面补丁负责）。
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: auto

# Grok 订阅插件（dsh-llm-xai-oauth）：固定伪装版本。
# 上游 cli-chat-proxy 会校验 x-grok-client-version，插件默认的 1.0.0 会被 426 拒绝
# （响应体要求 1.0.13 or later）；这里写在出厂 patch，用户不必手工改配置。
# 以后服务端继续抬版本时，只改这一处并重新打包。
- id: llm-xai-oauth
  config:
    clientVersion: "1.0.13"
