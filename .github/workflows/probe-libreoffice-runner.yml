name: probe-libreoffice-runner

# 探针（手动触发）：**只**回答一个问题 —— DeepSeek 预编译的 `libreoffice-kit` 引擎，
# 在指定的 runner 镜像上到底能不能把 docx / xlsx / pptx 转成 PDF。
#
# ## 为什么要有它
#
# dsh 0.1.7 给打包链的最后一步加了 Office→PDF 冒烟（`apps/desktop/scripts/smoke-runtime.ts`），
# 它在 `windows-latest` 上**必现**失败：docx（Writer）能转，xlsx（Calc）报
# `loadComponentFromURL returned an empty reference`，pptx（Impress）直接原生崩溃
# （helper `exit 3221225477` = 0xC0000005 访问违规）。
#
# 而 `scripts/diag-libreoffice.mjs` 在 CI 上取到的证据说明**不是我们的问题**：
#   · 载荷对上游 `prebuilds.json` 全量 sha256 清单 **2051/2051 一致**（与本机逐字节相同）；
#   · 夹具字节数与本机完全一致（docx 36593 / xlsx 4847 / pptx 28276）；
#   · **绕开 dsh 宿主**单跑 kit CLI 同样失败 ⇒ 与我们的打包、补丁、宿主都无关。
#
# 于是唯一的变量就剩 runner 的**操作系统镜像**。验证这一点若走发版全链，一次 15 分钟；
# 这个探针把变量压到最小（只装那个包 + 生成夹具 + 跑三次转换），几分钟出结论。
#
# ## 用法
#
# ```bash
# gh workflow run probe-libreoffice-runner.yml --ref main -f runner=windows-2022
# gh workflow run probe-libreoffice-runner.yml --ref main -f runner=windows-latest
# ```
#
# A/B 两个镜像各跑一次，就能回答「换镜像能不能解决」。
# ⚠️ 探针**只诊断、不改发版流程**；结论落定后可以删掉这个文件。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner 镜像（windows-2022 / windows-latest）
        required: true
        default: windows-2022
        type: string
      kit_version:
        description: '@deepseek-ai/libreoffice-kit 的版本'
        required: false
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20

    steps:
      - name: 环境（镜像 / 内存 / TEMP / 打印机）
        shell: pwsh
        run: |
          Write-Host "runner=${{ inputs.runner }}"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize, FreePhysicalMemory | Format-List
          Write-Host "TEMP=$env:TEMP"
          # 打印机：Windows runner 历史上没有默认打印机，而 LibreOffice 的页面设置在
          # headless 下也会查打印机 —— 两个镜像都空就说明这条不是差异来源。
          $printers = @(Get-CimInstance Win32_Printer -ErrorAction SilentlyContinue)
          Write-Host "打印机数量: $($printers.Count)"
          $printers | Select-Object -ExpandProperty Name

      - name: 只装那个包（不碰任何我们自己的代码）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lo-probe'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Set-Location $dir
          npm init -y | Out-Null
          npm install --no-audit --no-fund "@deepseek-ai/libreoffice-kit@${{ inputs.kit_version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "装到了这些包："
          Get-ChildItem node_modules\@deepseek-ai | Select-Object -ExpandProperty Name
          # 载荷自带全量 sha256 清单 —— 顺手核一遍，证明「载荷是完整的」这个前提成立。
          $payload = 'node_modules\@deepseek-ai\libreoffice-kit-win32-x64'
          $manifest = Get-Content "$payload\prebuilds.json" -Raw | ConvertFrom-Json
          $entries = @($manifest.files.PSObject.Properties)
          $missing = 0
          $changed = 0
          foreach ($entry in $entries) {
            $file = Join-Path $payload $entry.Name
            if (-not (Test-Path $file)) { $missing++ ; continue }
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { $changed++ }
          }
          Write-Host "载荷清单 $($entries.Count) 条：缺失 $missing / 哈希不符 $changed"

      - name: 生成夹具（用 runner 的 python）
        shell: pwsh
        run: |
          # 镜像里 python 不一定在 PATH 上（有时只有 py launcher），先确定解释器。
          $py = 'python'
          if (-not (Get-Command $py -ErrorAction SilentlyContinue)) {
            if (Get-Command py -ErrorAction SilentlyContinue) { $py = 'py' } else { throw '找不到 python' }
          }
          Write-Host "python 用: $py"
          & $py -m pip install --quiet python-docx openpyxl python-pptx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = Join-Path $env:RUNNER_TEMP 'lo-probe'
          Set-Location $dir
          # 下面的正文与上游 tests/fixtures/office-conversion-inputs.py 等价，便于和本机对齐。
          # ⚠️ 这里整段必须与 `@'` 同缩进：YAML 块标量一旦遇到更浅的缩进就提前结束。
          $fixture = @'
          from pathlib import Path
          from docx import Document
          from openpyxl import Workbook
          from pptx import Presentation
          from pptx.util import Inches

          root = Path(".")
          document = Document()
          document.add_paragraph("Desktop Office conversion 42")
          document.save(root / "input.docx")
          workbook = Workbook()
          workbook.active.append(["Desktop Office conversion", 42])
          workbook.save(root / "input.xlsx")
          workbook.close()
          presentation = Presentation()
          slide = presentation.slides.add_slide(presentation.slide_layouts[6])
          slide.shapes.add_textbox(Inches(1), Inches(1), Inches(6), Inches(1)).text = "Desktop Office conversion 42"
          presentation.save(root / "input.pptx")
          '@
          # 赋给变量再写盘：避免 `'@ | Set-Content` 那种「闭引号后面直接接管道」的写法，
          # 那种写法依赖 `'@` 恰好落在行首，很容易被后续编辑踩坏。
          Set-Content -Path fixture.py -Value $fixture -Encoding utf8
          & $py fixture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem input.* | Select-Object Name, Length

      - name: 三次转换（绕开任何宿主，只用 kit CLI）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lo-probe'
          Set-Location $dir
          $cli = 'node_modules\@deepseek-ai\libreoffice-kit\lib\cli.js'
          Write-Host '---- capabilities ----'
          node $cli capabilities | Select-Object -First 1
          Write-Host "  exit=$LASTEXITCODE"
          foreach ($ext in 'docx', 'xlsx', 'pptx') {
            Write-Host "---- convert $ext ----"
            $out = "out.$ext.pdf"
            node $cli convert --input "input.$ext" --output $out
            $code = $LASTEXITCODE
            if (Test-Path $out) {
              $head = [System.Text.Encoding]::ASCII.GetString((Get-Content $out -AsByteStream -TotalCount 5))
              Write-Host "  exit=$code  产物 $((Get-Item $out).Length) 字节  头=$head"
            } else {
              Write-Host "  exit=$code  产物：没产出"
            }
          }

      - name: 结论怎么读
        if: always()
        shell: pwsh
        run: |
          Write-Host '判读：'
          Write-Host '  · 三个都 exit=0     ⇒ 这个镜像能跑，换镜像可用'
          Write-Host '  · xlsx/pptx 仍失败  ⇒ 与镜像无关，要到引擎/系统组件那一层找'
          Write-Host '  · docx 过、xlsx 挂  ⇒ 与发版 CI 上观察到的现象一致（Writer 能转，Calc/Impress 不行）'
          Write-Host '比较两个镜像的输出即可判定「换 windows-2022 能不能解决」。'
