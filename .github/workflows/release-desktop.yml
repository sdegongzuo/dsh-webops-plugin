name: release-desktop

# 发版「包含 dsh-webops-plugin 的整个 dsh 桌面端」Windows x64 便携版。
#
# 本机也能跑通（已实测产出 v0.1.0），但 harness 的 `prepare:dsh` 有三个坑必须在
# clone 之后打补丁才能过，补丁都在本仓里：
#
#   1. `docs/harness-desktop-build.patch`
#      - `prepare-dsh.ts` 把 `NPM_CONFIG_REGISTRY` 硬编码成 npmjs.org，
#        而 `--config.registry` 压不住 env（要用 pnpm 原生 `--registry=`）→ 直连慢到挂死。
#      - `install --prod --frozen-lockfile --trust-lockfile` 这组标志会让 pnpm 拒绝联网取
#        registry 依赖，卡在 `added 241/507`、`download` 恒为 0。去掉后 21.5 秒装完。
#      - `runtime-payload-smoke.mjs` 校验 `fs-ext`，但 fs-ext **不在 0.1.5-rc.2 的依赖树里**
#        （产物 node_modules 里搜不到，518 个 tarball 也没有）→ 跳过该项。
#      - 0.1.6 把 dsh 运行时从 extraResources 挪进了 `files`（于是被封进 app.asar）。
#        这有两条后果，都让 `desktop-runtime.json` 的 `files` 清单对不上：
#        filter `['**/*']` 按 minimatch 默认不放行点文件（145 个 `.keep` / `.yarn/**`）；
#        更要命的是进了 app 目录就会被 electron-builder 当生产依赖剪裁，实测
#        **239 个包的 package.json 字节被改小**。所以这里把 dsh 挪回
#        extraResources，并让 `main.ts` 打包态的 dsh 指回 `resources\dsh`
#        （0.1.5 及更早就是这条路径）。代价只是少享一点上游的 asar 收益。
#   2. `scripts/patch-electron-builder.mjs`
#      electron-builder 解包完立即 rename，Windows 上因句柄未释放报 EPERM。加个重试。
#
# 注：**不需要 Visual C++ 构建工具**。node-pty 用的是预编译的 conpty.dll，
# koffi / sharp 同理，实测一遍都没编译过原生模块。
#
# 补丁只改 CI 里的临时 checkout，不污染本地 harness。
#
# 触发：
#   推 `desktop-v*` tag（与插件便携版的 `v*` tag 区分开），或 Actions 手动补发。

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不含 v 前缀，例如 0.1.0）
        required: true
        type: string
      harness_ref:
        description: deepseek-harness 的 ref（tag / branch / sha）
        required: false
        type: string

permissions:
  contents: write

env:
  # 默认 pin 到与本机 checkout 一致的提交，避免上游 main 漂移把构建搞挂。
  # ddefc45fbc = master @ dsh 0.1.6-alpha.2（PR #4469）。之所以必须跟着上游走：
  # `docs/harness-desktop-build.patch` 的上下文行取自这个提交，pin 旧 ref 会直接 apply 失败。
  # 换 ref 会让本体缓存 key 失效，CI 得全量重建一次（~18min），属预期。
  HARNESS_REF: ${{ inputs.harness_ref || 'ddefc45fbc7f8e46dd73185e68295696d1297887' }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', inputs.version) || github.ref_name }}
  # ⚠️ 这一条**不生效**：dsh 0.1.6-alpha.2 起 `loadDesktopPackageEnvironment()` 会把环境变量里的
  # release 设置全部过滤掉（`AMBIENT_RELEASE_SETTING`），`DSH_DESKTOP_APP_ID` 只能由
  # `apps/desktop/.env.windows` 提供（见下面「写桌面端打包设置」那一步）。留在这里只是标注取值。
  DSH_DESKTOP_APP_ID: com.sdegongzuo.dshwebops

jobs:
  portable-win-x64:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: 签出插件仓
        uses: actions/checkout@v4

      - name: 校验 tag 版本与 package.json 一致
        # 放最前面（在拉 harness / 装依赖那堆几分钟的步骤之前），5 秒就能给出结论。
        # 为什么必须有：`--version` 是**显式传**下去的，它会同时决定 zip 名、
        # profile 里登记的插件版本、以及随包插件 package.json 的 version。
        # 于是「tag 是 desktop-v0.2.9 而 package.json 还停在 0.2.6」不会报任何错，
        # 只会产出一个自称 0.2.9、里面却是 0.2.6 的包 —— 用户报的版本号从此不可信。
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^desktop-v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag: $version / package.json: $pkg"
          if ($pkg -ne $version) { throw "版本不一致：tag=$version package.json=$pkg —— 先把 package.json 的版本提上去（并推一个提交）再打 tag" }

      - name: 装 pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 取 deepseek-harness 源码
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $PWD) 'deepseek-harness'
          Write-Host "harness ref: $env:HARNESS_REF -> $dest"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Set-Location $dest
          git init --quiet
          git remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth 1 origin $env:HARNESS_REF
          git checkout --quiet FETCH_HEAD

      - name: 应用 harness 构建补丁
        # 修 prepare:dsh 的 registry 硬编码 / install 标志 / fs-ext 冒烟校验，见文件头说明。
        shell: pwsh
        run: |
          Set-Location (Join-Path (Split-Path $PWD) 'deepseek-harness')
          git apply --ignore-whitespace "$env:GITHUB_WORKSPACE/docs/harness-desktop-build.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --no-pager diff --stat

      - name: 写桌面端打包设置（.env.windows）
        # dsh 0.1.6-alpha.2 起 `scripts/desktop-package-environment.mjs` 把平台设置**只**从
        # `apps/desktop/.env.windows` 读，读不到就抛
        # `cannot read …\.env.windows; copy …example and fill in the local settings`，
        # 打包一步都走不动（旧 ref 0d1f5000 上这个加载器还不存在，所以是本轮新加的前置）。
        # 两个必须在文件里、写环境变量没用的键：
        #   · DSH_DESKTOP_APP_ID —— 环境变量会被 `AMBIENT_RELEASE_SETTING` 过滤掉；
        #   · 选中部署的那个 mandatory-update origin —— `resolveDesktopPolicyEnvironment()`
        #     在 --unsigned 下**照样**要过（只有签名/自动更新凭据会被 --unsigned 跳过）。
        # `DSH_DESKTOP_AUTO_UPDATE_ENV` 的合法取值是 'test' / 'production'（不是 'prod'）。
        # 其余（签名证书、上传凭据）留空：--unsigned 不需要。
        shell: pwsh
        run: |
          $path = Join-Path (Join-Path (Split-Path $PWD) 'deepseek-harness') 'apps\desktop\.env.windows'
          @(
            'DSH_DESKTOP_APP_ID=com.sdegongzuo.dshwebops'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com'
            'DSH_DESKTOP_WINDOWS_CER_FILE='
            'DSH_DESKTOP_WINDOWS_SIGNTOOL='
            'DSH_DESKTOP_WINDOWS_KEY_CONTAINER='
            'DSH_DESKTOP_WINDOWS_TOKEN_PIN='
          ) | Set-Content -Path $path -Encoding utf8
          Write-Host "已写 $path"
          ($_ = Get-Content $path).Count | ForEach-Object { Write-Host "  行数: $_" }

      - name: 装 harness 依赖
        shell: pwsh
        timeout-minutes: 30
        run: |
          Set-Location (Join-Path (Split-Path $PWD) 'deepseek-harness')
          pnpm install --no-frozen-lockfile

      - name: 装本仓依赖
        # 这两步原 workflow 漏了，desktop-v0.2.0 第一次跑就栽在
        # 「package-desktop-portable: 缺少 lib/，先跑 pnpm build」——
        # package-desktop-portable.mjs:73 硬要求 lib/（插件构建产物），
        # 而「生成桌面端」这条链路并不产出它（那是 release.yml 的事）。
        # devDependencies 里 13 个 dsh 包是 `link:../deepseek-harness/...`，故必须在取
        # harness 之后。放这里而不是打包前，是为了插件构建失败能早失败，
        # 不必等 120 分钟的 dsh 打包跑完才报。
        run: pnpm install --no-frozen-lockfile

      - name: 构建插件
        run: pnpm build

      - name: 修 electron-builder 解包 rename 的 EPERM
        # 必须在 pnpm install 之后（改的是 node_modules 里的 app-builder-lib）。
        shell: pwsh
        run: |
          node "$env:GITHUB_WORKSPACE/scripts/patch-electron-builder.mjs" (Join-Path (Split-Path $PWD) 'deepseek-harness')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 判断 tar 是否需要 --force-local
        # Git Bash 的 GNU tar 会把 Windows 盘符路径当成远程主机（`Cannot connect to D:`），
        # 本机就是栽在这。但 Windows 自带的 bsdtar 不认识 --force-local，所以只认 GNU 再设。
        shell: pwsh
        run: |
          $tar = (Get-Command tar).Source
          $banner = (& tar --version 2>&1 | Out-String)
          if ($banner -match 'GNU tar') {
            Add-Content -Path $env:GITHUB_ENV -Value 'TAR_OPTIONS=--force-local'
            Write-Host "GNU tar ($tar) -> TAR_OPTIONS=--force-local"
          } else {
            Write-Host "tar=$tar 非 GNU，不设 TAR_OPTIONS"
          }

      - name: 恢复 dsh 桌面端本体缓存（win-unpacked）
        # 这一步原本是全 workflow 最贵的一步（实测 631s，占 61%）：electron-builder 要把
        # 1.2G / 14071 个文件解包组装成 app 目录，不是编译，纯粹是 IO。
        # dsh 本体只在 harness ref 变化时才需要重建，所以按 HARNESS_REF + 两处补丁内容做
        # key 缓存整个目录 —— 插件自己迭代时直接命中，跳过这一步。
        #
        # 缓存的是 `.desktop-base` **整个目录**而不是某一个 app 目录：本地脚本按 dsh 版本
        # 分槽存（`.desktop-base/<版本>/app`），槽位名要构建完才知道，缓存路径没法事先写死。
        # key 里带 HARNESS_REF，所以 harness 一换就是全新缓存条目，不会新旧混着命中。
        id: base-cache
        uses: actions/cache@v4
        with:
          path: .desktop-base
          key: dsh-win-unpacked-${{ runner.os }}-${{ env.HARNESS_REF }}-${{ hashFiles('docs/harness-desktop-build.patch', 'scripts/patch-electron-builder.mjs') }}

      - name: 构建桌面端应用目录
        if: steps.base-cache.outputs.cache-hit != 'true'
        # `package:win:x64:dir` = electron-builder --dir，产出可直接运行的 win-unpacked 目录。
        # 必须带 --unsigned：本机/CI 都没有 SafeNet USB 签名令牌，而
        # `electron-builder.config.mjs:108` 是 forceCodeSigning: !unsigned。
        # 注意别写成 `pnpm run x -- --unsigned`：pnpm 会把 `--` 也传给脚本，
        # package-target.ts 会报 "expected at most one target"。
        shell: pwsh
        timeout-minutes: 120
        env:
          PYTHON: python
        run: |
          Set-Location (Join-Path (Split-Path $PWD) 'deepseek-harness\apps\desktop')
          pnpm run package:win:x64:dir --unsigned

      - name: 定位 win-unpacked
        id: locate
        shell: pwsh
        run: |
          # 命中缓存时：扫 `.desktop-base/<版本>/app`，且必须是**已经装完**的槽
          # （有 cache.json 完成标记、且真有主 exe）。判定交给脚本自己，这里只认它印的
          # `CACHE_APP_DIR=` 那一行 —— 一行机器可读标记，胜过在这里复制一遍校验逻辑。
          if ('${{ steps.base-cache.outputs.cache-hit }}' -eq 'true') {
            $line = (node scripts/package-desktop-portable.mjs --list-cached 2>&1 | Select-String '^CACHE_APP_DIR=' | Select-Object -First 1)
            if ($line) {
              $cached = $line.Line -replace '^CACHE_APP_DIR=', ''
              Write-Host "缓存命中，跳过构建：$cached"
              Add-Content -Path $env:GITHUB_ENV -Value "WIN_UNPACKED=$cached"
              exit 0
            }
            Write-Host "缓存目录里没有可用槽，回落重新构建"
          }

          $base = Join-Path (Split-Path $PWD) 'deepseek-harness\apps\desktop\.desktop-build\targets\win-x64'
          # 取**最新**的那个，不用 `Select-Object -First 1`：本机 .desktop-build 会留着
          # 多次构建的 win-unpacked，目录枚举顺序不保证任何东西，取错就会打出旧本体。
          $candidates = @(Get-ChildItem -Path $base -Recurse -Directory -Filter 'win-unpacked' -ErrorAction SilentlyContinue |
                          Sort-Object LastWriteTime -Descending)
          if ($candidates.Count -eq 0) { throw "没找到 win-unpacked（搜过 $base）" }
          $app = $candidates[0]
          Write-Host "候选 $($candidates.Count) 个，取最新：$($app.FullName)（$($app.LastWriteTime)）"
          # 入库交给脚本：槽位名取自 app 自己的 desktop-runtime.json，这里不重复算版本号。
          # --cache-move 让它优先同盘改名（瞬时），失败会自动回落成拷贝。
          $out = node scripts/package-desktop-portable.mjs --app $app.FullName --cache-base --cache-move --cache-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out | Write-Host
          $cached = (($out | Select-String '^CACHE_APP_DIR=' | Select-Object -First 1).Line) -replace '^CACHE_APP_DIR=', ''
          if (-not $cached) { throw "脚本没报出 CACHE_APP_DIR（缓存入库失败？）" }
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_UNPACKED=$cached"

      - name: 物化插件 profile 并打便携版 zip
        # 把插件按官方模板写进 profile，随 zip 分发；启动器用 DSH_HOME 把配置锁在包内。
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^desktop-v', ''
          Write-Host "version: $version"
          node scripts/package-desktop-portable.mjs --app "$env:WIN_UNPACKED" --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 按**确定的文件名**取，不用 `Get-ChildItem dist/*.zip | Select-Object -First 1`：
          # dist/ 里会同时躺着三种 zip（整包 / 插件便携包 / 增量包，本机实测有过 9 个），
          # `-First 1` 取到哪个纯看目录枚举顺序 —— 于是 sha256 会贴到另一个文件上，
          # 而 Release 附件还是对的，极难发现。取不到就直接失败，不静默放过。
          $zipPath = Join-Path dist "dsh-webops-desktop-v$version-win-x64-portable.zip"
          if (-not (Test-Path $zipPath)) { throw "没打出预期的产物：$zipPath" }
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$(Split-Path -Leaf $zipPath)"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_SHA256=$((Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_MB=$([math]::Round((Get-Item $zipPath).Length / 1MB, 1))"

      - name: 发版前自检（生产路径）
        # 前面各步只保证「能构建出来」，不保证「构建出来的东西能起来」：
        # v0.1.0 / v0.2.0 两次发版都因此翻车（插件登记被 createPluginProfile 静默抹掉、
        # 出货 patch 误带 fake-llm 接管 llm/stream）。这两件事 typecheck / test / 构建都拦不住。
        # verify-portable 用 harness 真代码走一遍桌面端启动准备（全量 sha256 完整性 +
        # runtimeId / nodeVersion / platform / arch 对齐 + 建 241 条宿主链接 + 依赖图校验），
        # 再真起一次宿主读 __DSH_BOOT__。不过就不发 Release。
        #
        # 验的是**解压后的 zip**：打包脚本收尾会 rmSync 掉 .desktop-stage
        # （package-desktop-portable.mjs:259），所以那个中间目录在这里已经没了。
        # 验解压产物反而更忠实 —— 那正是用户拿到的东西，顺带证明 zip 本身没坏。
        #
        # 后三条是 2026-09-17 补的，都验「构建得出来 ≠ 跑得起来」那一类：
        #   verify-ptc      —— ptc 模式下 run_code 的执行体（子进程）真能跑起来。
        #                      打包态 process.execPath 是 Electron exe，而 ptc 子进程会
        #                      删掉 ELECTRON_RUN_AS_NODE，于是永远不回应。只验「服务存在」
        #                      拦不住，必须真跑一段程序看返回值。
        #   verify-settings —— 出厂 settings.yaml 真的注册成了 llm provider。
        #                      字段名写错（baseURL/baseUrl）或取值越界时，pi-ai 会把
        #                      **整条路由静默拒掉**，用户只看到「一个模型都没有」。
        #   verify-browser-host —— agent 调 browser_open 真能开出窗口（spawn 主 exe 的
        #                      窗口宿主 → 真导航 → 快照 + 截图），并在 cdp/electron
        #                      同时可用时断言 provider 选对了。
        #                      2026-09-15「没法打开新窗口」与 2026-09-17「ambiguous」
        #                      两次真机事故都在这一段，而此前它**只能真机点一遍**。
        #                      这条会真的起 Electron 窗口，需要 runner 有可用会话
        #                      （windows-latest 有）；跑不通就拦在这，不发 Release。
        # 三条新检查都只用临时 home / 临时解析目录，不会把待验目录「启动过」，
        # 所以能跟在 verify-portable 后面依次跑。
        shell: pwsh
        env:
          # harness 是插件仓的兄弟目录（同「取 deepseek-harness 源码」step 的 Split-Path 结果）。
          # 用 GitHub 表达式拼路径而不是 pwsh 的 Join-Path/Split-Path —— 少一层本机验不了的语法风险
          # （这个环境里 psh 工具输出恒为空，pwsh 表达式没法本地试跑）。
          HARNESS_ROOT: ${{ github.workspace }}/../deepseek-harness
        run: |
          $zip = Join-Path "$env:GITHUB_WORKSPACE\dist" "$env:ZIP_NAME"
          $dest = Join-Path "$env:GITHUB_WORKSPACE" ".desktop-verify"
          Write-Host "解压后再自检: $zip -> $dest"
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          node "$env:GITHUB_WORKSPACE/scripts/verify-portable.mjs" --dir "$dest" --harness "$env:HARNESS_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:GITHUB_WORKSPACE/scripts/verify-ptc.mjs" --dir "$dest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:GITHUB_WORKSPACE/scripts/verify-settings.mjs" --dir "$dest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:GITHUB_WORKSPACE/scripts/verify-browser-host.mjs" --dir "$dest" --out "$env:GITHUB_WORKSPACE/dist/verify-browser-host.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 写 release 说明
        shell: pwsh
        run: |
          $notes = @'
          ## dsh 桌面端便携版 __TAG__

          内置 [dsh-webops-plugin](https://github.com/sdegongzuo/dsh-webops-plugin) 的
          DeepSeek Harness 桌面端。**解压即用**：不需要 Node、pnpm、Git，也不需要联网装插件。

          ### 用法

          1. 解压到**不含中文和空格**的路径
          2. 双击 **启动.cmd**；直接双击 `app\` 里的 exe 也一样 —— 从 v0.2.2 起 exe 会自己
             认出旁边的 `home\`（`resolvePortableDshHome`），配置照样随包走
          3. 首次运行会被 SmartScreen 拦，点「更多信息」→「仍要运行」

          ### 第一次打开：填一个模型 API Key

          包里的 `home\settings.yaml` 已经预置好**云知声 MaaS**（[maas.unisound.com](https://maas.unisound.com)，
          OpenAI 兼容），默认模型 `u2-flash`，备选 17 个（DeepSeek / Kimi / GLM / MiniMax / Qwen 等）。
          **包里不含任何 API Key**，需要你自己填一个：

          1. 打开「设置 → 模型」，找到 **云知声 MaaS**
          2. 粘贴你的 API Key —— 它会写进 `home\.credentials.yaml`，下次启动自动带上

          也可以不改界面，直接设环境变量 `UNISOUND_API_KEY`（环境变量优先级更高，但只读、不会被设置页改写）。

          API Key 在 [maas.unisound.com](https://maas.unisound.com) 控制台申请。

          ### 这一版装在里面的是什么

          - dsh 桌面端本体（Electron + 内置 Node 运行时 + 内置 pnpm + dsh 生产依赖树）
          - 插件 `dsh-webops-plugin`，已按桌面端要求物化进 `home\profiles\desktop\`
            （真实文件副本，不是链接；`dsh.profile.bundles` 里已登记）

          ### 验证插件生效

          启动后输入框上方应能看到「网页操作」状态条，让 agent 调用 `browser_open` 能开出页面。

          ### 数据在哪

          `home\` 是 dsh 的全部用户数据（会话 / 设置 / 凭据 / 已装插件）。整个目录拷到 U 盘就能带走，删掉即恢复出厂。

          ### 产物

          | 文件 | 大小 | SHA-256 |
          | --- | --- | --- |
          | __ZIP__ | __MB__ MB | __SHA__ |

          **未签名构建**：CLI 这条链路的产物不做代码签名，SmartScreen 会有提示。
          '@
          $notes = $notes -replace '__TAG__', $env:TAG `
                           -replace '__ZIP__', $env:ZIP_NAME `
                           -replace '__MB__', $env:ZIP_MB `
                           -replace '__SHA__', $env:ZIP_SHA256
          $notes | Out-File -FilePath dist/notes.md -Encoding utf8

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:TAG" `
            --title "$env:TAG · dsh 桌面端便携版（含网页操作插件）" `
            --notes-file dist/notes.md `
            (Get-ChildItem dist/*.zip).FullName
