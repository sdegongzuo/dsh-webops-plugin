name: release

# 发版流程：推 `v*` tag 即触发，必须同时产出完整便携包与独立插件包。
#
# 为什么必须在这里 clone deepseek-harness：本仓 devDependencies 里 13 个 dsh 包用的是
# pnpm 的 `link:../deepseek-harness/...`，指向**本机的 harness checkout**（README「接进
# dsh」有完整理由：npm 上的 dsh 包停在 0.0.1-rc.1，且 `@deepseek-ai/dsh-type-meta`
# 根本没发布）。所以 Actions 里不做这一步，`pnpm install` 必然失败。
#
# 也可以手动触发（Actions → Run workflow），用来补发某个已存在的 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（必须已推送到远端）
        required: true
        type: string
      harness_ref:
        description: deepseek-harness 的 ref（tag / branch / sha）
        required: false
        type: string

permissions:
  contents: write

# 理由同 `release-desktop.yml` 的同名块：同一个**要发的 tag**上不并跑两个 run（会同时
# `gh release upload --clobber` 抢同一份附件）；后来者排队等而不是把前一个打断，
# 因为 `--clobber` 是「先删旧资产再上传」，打断可能留下一份缺附件的公开 Release。
# ⚠️ 键**不能只用 `github.ref`**：tag push 是 `refs/tags/v0.1.0`，在 main 上 dispatch 补发
# 同一个 tag 时是 `refs/heads/main` —— 两个键不同就等于没分组。这里与 `env.TAG` 用同一个
# 表达式，保证 push 与 dispatch 落同一组；不同 tag 仍是不同组，可以并行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 默认 pin 到与本机 checkout 一致的提交，避免上游 main 漂移把构建搞挂。
  # d743267388 = tag `dsh-v0.2.1-alpha.2`：与 `release-desktop.yml`
  # 用同一个 ref，也让本 workflow 的构建对着我们实际随包出货的那个 harness 版本。
  HARNESS_REF: ${{ inputs.harness_ref || 'd743267388641bc76f17c45ce8b4c231aed1d32c' }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BASE_DESKTOP_TAG: v0.2.15
  BASE_DESKTOP_ASSET: dsh-webops-desktop-v0.2.15-win-x64-portable.zip
  BASE_DESKTOP_SHA256: 771170d847cc36629ae989c56d0357ee215feece47f470df99122c6f21e77465

jobs:
  portable-win-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 签出本仓
        # 显式签出 `$env:TAG` 指向的 ref，理由同 `release-desktop.yml` 的同名步骤：
        # checkout 默认只在 `push: tags` 下等于该 tag，`workflow_dispatch` 会签出 UI 选的
        # 分支（默认 main）⇒ 「补发某个已存在的 tag」会变成「拿 main 的代码冒充旧 tag」。
        # ⚠️ 因此 dispatch 的 `tag` 输入**必须带 `v` 前缀**（与推 tag 时的 `github.ref_name` 同形）；
        # 写漏了 checkout 会直接报「找不到该 ref」——这是有意的，比静默发错包好。
        # actions 版本口径同 `release-desktop.yml`：取**最小**已声明 `runs.using: node24`
        # 的大版本（v4 声明的都是 node20，runner 强制升 node24 会报弃用告警）。输入项已核过。
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: 校验 tag 版本与 package.json 一致
        # 与 `release-desktop.yml` 的同名步骤同一条理由（AGENTS.md 也写着「两个 workflow
        # 第一步都断言」，此前这条只存在于桌面端那个 workflow 里，是个缺口）。
        # `--version` 是**显式传**下去的，两个打包脚本都会拿它覆盖产物内 package.json 的
        # version（各脚本末尾的 `const releasePkg = { ...pkg, version }`）。于是「tag 是 v0.2.9
        # 而本仓 package.json 还停在 0.2.6」不会报任何错，只会让**仓里声明的版本**与
        # **发出去的包**对不上 —— 之后「这个版本号到底发过没有」就无从判断了。
        # 因为上面签出的就是该 tag，这里读工作区的 package.json 即「该 tag 的 package.json」。
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag: $version / package.json: $pkg"
          if ($pkg -ne $version) { throw "版本不一致：tag=$version package.json=$pkg —— 先把 package.json 的版本提上去（并推一个提交）再打 tag" }

      - name: 装 pnpm + Node
        uses: pnpm/action-setup@v5
        with:
          version: 11.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 取 deepseek-harness 源码
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $PWD) 'deepseek-harness'
          Write-Host "harness ref: $env:HARNESS_REF → $dest"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Set-Location $dest
          git init --quiet
          git remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth 1 origin $env:HARNESS_REF
          git checkout --quiet FETCH_HEAD
          Get-Content package.json | Select-Object -First 3

      - name: 装 harness 的依赖
        # link 目标内部会 import 第三方包，而 pnpm 对 `link:` 依赖不装目标的依赖，
        # 得靠 harness 根自己的 node_modules 兜住解析。这一步失败不必然导致构建失败
        # （first-party 包在 tsdown 里是 external，多数情况不读源码），所以不阻断。
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        run: |
          Set-Location (Join-Path (Split-Path $PWD) 'deepseek-harness')
          pnpm install --ignore-scripts --no-frozen-lockfile

      - name: 装本仓依赖
        run: pnpm install --no-frozen-lockfile

      # ⚠️ 这里**故意不跑** `pnpm typecheck` / `pnpm test`：CI 的全新 checkout 里没有 harness
      # 的构建产物（`@deepseek-ai/*` 的 `main`/`types` 都指向被 gitignore 的 `lib/`），
      # 跑必然炸 —— 实测 35×TS2307。完整理由与证据见 `release-desktop.yml` 同位置的注释块，
      # 以及 `src/bundle-patch.test.ts` 的「发布链的身份契约」。
      #
      # ⚠️ 也**故意不走** `pnpm build`：它展开是 `tsdown && node scripts/copy-assets.mjs`，
      # 而 tsdown 配置里第一个 bundle `clean: true` —— 等于先整目录删除 lib/ 再重建。
      # 本仓文件规则禁止任何删除分支；这里显式 `--no-clean`（CLI 覆盖配置），产物与
      # 既有文件并存，chunk 名带内容哈希不会互相覆盖，client 那半本来就是 clean: false。
      - name: 构建（no-clean，不删除既有产物）
        run: |
          pnpm exec tsdown --no-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/copy-assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打独立插件包（保留安全模式）
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $libDir = Join-Path $env:GITHUB_WORKSPACE 'lib'
          $stageRoot = Join-Path $env:RUNNER_TEMP 'webops-package-stage'
          $pluginZip = Join-Path dist "dsh-webops-plugin-v$version.zip"
          node scripts/package-portable.mjs $version --lib-dir $libDir --stage-root $stageRoot --keep-stage --out $pluginZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $pluginZip)) { throw "没打出预期的产物：$pluginZip" }
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_NAME=$(Split-Path -Leaf $pluginZip)"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_SHA256=$((Get-FileHash $pluginZip -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_KB=$([math]::Round((Get-Item $pluginZip).Length / 1KB, 1))"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_VERSION=$version"

      - name: 组装并验证本次完整便携包（失败即阻止发布）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: '1'
        run: |
          $baseRoot = Join-Path $env:RUNNER_TEMP 'webops-base-desktop'
          New-Item -ItemType Directory -Path $baseRoot | Out-Null
          gh release download $env:BASE_DESKTOP_TAG --pattern $env:BASE_DESKTOP_ASSET --dir $baseRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseZip = Join-Path $baseRoot $env:BASE_DESKTOP_ASSET
          if ((Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLower() -ne $env:BASE_DESKTOP_SHA256) { throw 'DSH 基包哈希不一致，拒绝发布' }
          python scripts/unzip-portable.py --zip $baseZip --dir $baseRoot --only-prefix app/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:PLUGIN_VERSION
          $portableZip = Join-Path dist "dsh-webops-desktop-v$version-win-x64-portable.zip"
          $stageRoot = Join-Path $env:RUNNER_TEMP 'webops-full-stage'
          node scripts/package-release-portable.mjs --app (Join-Path $baseRoot 'app') --plugin-zip (Join-Path dist $env:PLUGIN_ZIP_NAME) --version $version --stage-root $stageRoot --out $portableZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkRoot = Join-Path $env:RUNNER_TEMP 'webops-full-check'
          python scripts/unzip-portable.py --zip $portableZip --dir $checkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-release-portable.mjs --dir $checkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content (Join-Path $checkRoot 'release-manifest.json') -Raw | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_ENV -Value "DSH_VERSION=$($manifest.dshVersion)"
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_ZIP_NAME=$(Split-Path -Leaf $portableZip)"
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_ZIP_SHA256=$((Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_ZIP_KB=$([math]::Round((Get-Item $portableZip).Length / 1KB, 1))"

      - name: 写 release 说明
        shell: pwsh
        run: |
          $notes = @'
          ## dsh-webops-plugin __TAG__ · 完整便携包与独立插件包

          下载 `__PLUGIN_ZIP__`，包内包含完整编译插件及 INSTALL.md，无需重新下载 DSH 桌面整包。

          首次安装下载 `__PORTABLE_ZIP__`，解压后双击启动.cmd；内置本次插件、Context 与 Better Sidebar 三个插件。DSH 本体版本为 __DSH_VERSION__，插件版本为 __VERSION__。首次使用请在设置中填写自己的 API Key；不含凭据或会话数据。

          ### 更新已有插件

          1. 完全退出 DSH。
          2. 将 ZIP 内的文件合并覆盖到实际加载的 `dsh-webops-plugin` 插件目录。
             便携版默认位置：`home/profiles/desktop/node_modules/dsh-webops-plugin/`。
             本包根目录是插件内容，不能直接解压到便携版根目录。
          3. 重新启动，核对插件 package.json 的 version 为 `__VERSION__`，并实际调用网页工具。

          保留旧 chunk 和用户 profile 登记。首次安装按包内 INSTALL.md 执行 `dsh plugin add`。
          每次发布都提供完整便携包；已有用户也可只更新插件。其他宿主版本的兼容性以实测为准。

          | 文件 | 大小 | SHA-256 |
          | --- | --- | --- |
          | __PLUGIN_ZIP__ | __PLUGIN_KB__ KB | __PLUGIN_SHA__ |
          | __PORTABLE_ZIP__ | __PORTABLE_KB__ KB | __PORTABLE_SHA__ |
          '@
          $notes = $notes -replace '__TAG__', $env:TAG `
                           -replace '__VERSION__', $env:PLUGIN_VERSION `
                           -replace '__PLUGIN_ZIP__', $env:PLUGIN_ZIP_NAME `
                           -replace '__PLUGIN_KB__', $env:PLUGIN_ZIP_KB `
                           -replace '__PLUGIN_SHA__', $env:PLUGIN_ZIP_SHA256 `
                           -replace '__PORTABLE_ZIP__', $env:PORTABLE_ZIP_NAME `
                           -replace '__PORTABLE_KB__', $env:PORTABLE_ZIP_KB `
                           -replace '__PORTABLE_SHA__', $env:PORTABLE_ZIP_SHA256 `
                           -replace '__DSH_VERSION__', $env:DSH_VERSION
          $notes | Out-File -FilePath dist/notes.md -Encoding utf8

      - name: 发布 Release
        # 保留式发布：**只在 Release 不存在时新建**。旧写法里「已存在就 upload --clobber
        # 覆盖附件」的分支已按本仓文件规则移除 —— 覆盖 = 先删旧资产再传新的，属于删除
        # 分支；且已发布 tag 保持原提交与原附件（docs/打包与发版.md §10）。撞上同名
        # Release 说明版本号被复用，明确失败让发版人换新版本号，而不是悄悄替换历史产物。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 显式列出插件附件，不用 `dist/*.zip` 通配 —— 万一以后 dist/ 里多出别的 zip，
          # 通配会把不相干的文件一起传上去。
          $pluginZip = Join-Path "$env:GITHUB_WORKSPACE\dist" "$env:PLUGIN_ZIP_NAME"
          if (-not $env:PORTABLE_ZIP_NAME) { throw '完整便携包未通过验证，禁止发布' }
          $portableZip = Join-Path "$env:GITHUB_WORKSPACE\dist" "$env:PORTABLE_ZIP_NAME"
          foreach ($f in @($pluginZip, $portableZip)) {
            if (-not (Test-Path $f)) { Write-Error "找不到待发布的产物：$f"; exit 1 }
          }

          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $env:TAG 已存在 —— 保留式发布不覆盖既有附件、不重指已发布 tag；请换一个新版本号重新发布。"
            exit 1
          }
          gh release create "$env:TAG" --draft --title "$env:TAG" --notes-file dist/notes.md $pluginZip $portableZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view "$env:TAG" --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($expected in @(
            @{ name = $env:PLUGIN_ZIP_NAME; digest = "sha256:$env:PLUGIN_ZIP_SHA256" },
            @{ name = $env:PORTABLE_ZIP_NAME; digest = "sha256:$env:PORTABLE_ZIP_SHA256" }
          )) {
            $asset = @($release.assets | Where-Object { $_.name -eq $expected.name })
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -ne $expected.digest) { throw "附件缺失或摘要不一致：$($expected.name)；保留草稿，不公开发布" }
          }
          gh release edit "$env:TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 收尾小结（无论成败都写）
        # 理由同 `release-desktop.yml` 的同名步骤：没有 `upload-artifact` ⇒ 失败的 run
        # 不留可下载产物，「红」容易被读成「什么都没出」。这里把插件附件的名字与大小写进
        # run 的 Summary，几 KB 就能把那个错觉消掉。
        if: always()
        shell: pwsh
        run: |
          $lines = @('## 产物与结论', '')
          $any = $false
          foreach ($name in @($env:PLUGIN_ZIP_NAME, $env:PORTABLE_ZIP_NAME)) {
            if (-not $name) { continue }
            $f = Join-Path "$env:GITHUB_WORKSPACE\dist" $name
            if (Test-Path $f) {
              $item = Get-Item $f
              $lines += "- 产物已打好：$($item.Name)（$([math]::Round($item.Length / 1KB, 1)) KB）"
              $any = $true
            } else {
              $lines += "- ⚠️ 缺少产物：$name"
            }
          }
          if (-not $any) { $lines += "- 产物**没产出** —— 失败发生在打包之前，是真失败。" }
          else { $lines += "> 若这次 run 显示失败，先看**哪一步**红：只有末步「发布 Release」红才是发布动作的问题（见 docs/打包与发版.md §11）。" }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
