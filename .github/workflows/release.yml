name: release

# 发版流程：推 `v*` tag 即触发，产出 Windows x64 便携版 zip 并挂到 GitHub Release。
#
# 为什么必须在这里 clone deepseek-harness：本仓 devDependencies 里 13 个 dsh 包用的是
# pnpm 的 `link:../deepseek-harness/...`，指向**本机的 harness checkout**（README「接进
# dsh」有完整理由：npm 上的 dsh 包停在 0.0.1-rc.1，且 `@deepseek-ai/dsh-type-meta`
# 根本没发布）。所以 Actions 里不做这一步，`pnpm install` 必然失败。
#
# 也可以手动触发（Actions → Run workflow），用来补发某个已存在的 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（必须已推送到远端）
        required: true
        type: string
      harness_ref:
        description: deepseek-harness 的 ref（tag / branch / sha）
        required: false
        type: string

permissions:
  contents: write

# 理由同 `release-desktop.yml` 的同名块：同一个 ref 上不并跑两个 run（会同时
# `gh release upload --clobber` 抢同一份附件）；后来者排队等而不是把前一个打断，
# 因为 `--clobber` 是「先删旧资产再上传」，打断可能留下一份缺附件的公开 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # 默认 pin 到与本机 checkout 一致的提交，避免上游 main 漂移把构建搞挂。
  # 477b4f4205 = tag `dsh-v0.1.7-rc.2`：与 `release-desktop.yml`
  # 用同一个 ref，也让本 workflow 的构建对着我们实际随包出货的那个 harness 版本。
  HARNESS_REF: ${{ inputs.harness_ref || '477b4f420553e8a52c2fbccc464d7561b239c443' }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  portable-win-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 签出本仓
        # 显式签出 `$env:TAG` 指向的 ref，理由同 `release-desktop.yml` 的同名步骤：
        # checkout 默认只在 `push: tags` 下等于该 tag，`workflow_dispatch` 会签出 UI 选的
        # 分支（默认 main）⇒ 「补发某个已存在的 tag」会变成「拿 main 的代码冒充旧 tag」。
        # ⚠️ 因此 dispatch 的 `tag` 输入**必须带 `v` 前缀**（与推 tag 时的 `github.ref_name` 同形）；
        # 写漏了 checkout 会直接报「找不到该 ref」——这是有意的，比静默发错包好。
        # actions 版本口径同 `release-desktop.yml`：取**最小**已声明 `runs.using: node24`
        # 的大版本（v4 声明的都是 node20，runner 强制升 node24 会报弃用告警）。输入项已核过。
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: 校验 tag 版本与 package.json 一致
        # 与 `release-desktop.yml` 的同名步骤同一条理由（AGENTS.md 也写着「两个 workflow
        # 第一步都断言」，此前这条只存在于桌面端那个 workflow 里，是个缺口）。
        # `--version` 是**显式传**下去的，两个打包脚本都会拿它覆盖产物内 package.json 的
        # version（各脚本末尾的 `const releasePkg = { ...pkg, version }`）。于是「tag 是 v0.2.9
        # 而本仓 package.json 还停在 0.2.6」不会报任何错，只会让**仓里声明的版本**与
        # **发出去的包**对不上 —— 之后「这个版本号到底发过没有」就无从判断了。
        # 因为上面签出的就是该 tag，这里读工作区的 package.json 即「该 tag 的 package.json」。
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag: $version / package.json: $pkg"
          if ($pkg -ne $version) { throw "版本不一致：tag=$version package.json=$pkg —— 先把 package.json 的版本提上去（并推一个提交）再打 tag" }

      - name: 装 pnpm + Node
        uses: pnpm/action-setup@v5
        with:
          version: 11.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 取 deepseek-harness 源码
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $PWD) 'deepseek-harness'
          Write-Host "harness ref: $env:HARNESS_REF → $dest"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Set-Location $dest
          git init --quiet
          git remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth 1 origin $env:HARNESS_REF
          git checkout --quiet FETCH_HEAD
          Get-Content package.json | Select-Object -First 3

      - name: 装 harness 的依赖
        # link 目标内部会 import 第三方包，而 pnpm 对 `link:` 依赖不装目标的依赖，
        # 得靠 harness 根自己的 node_modules 兜住解析。这一步失败不必然导致构建失败
        # （first-party 包在 tsdown 里是 external，多数情况不读源码），所以不阻断。
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        run: |
          Set-Location (Join-Path (Split-Path $PWD) 'deepseek-harness')
          pnpm install --ignore-scripts --no-frozen-lockfile

      - name: 装本仓依赖
        run: pnpm install --no-frozen-lockfile

      # ⚠️ 这里**故意不跑** `pnpm typecheck` / `pnpm test`：CI 的全新 checkout 里没有 harness
      # 的构建产物（`@deepseek-ai/*` 的 `main`/`types` 都指向被 gitignore 的 `lib/`），
      # 跑必然炸 —— 实测 35×TS2307。完整理由与证据见 `release-desktop.yml` 同位置的注释块，
      # 以及 `src/bundle-patch.test.ts` 的「发布链的身份契约」。
      - name: 构建
        run: pnpm build

      - name: 打插件便携包 + 增量更新包
        # 两个产物，面向两种用户：
        #   · dsh-webops-plugin-v<ver>-win-x64-portable.zip —— 纯插件包，走 `dsh plugin add`，
        #     给「自己有一份 dsh」的人；
        #   · dsh-webops-plugin-update-v<ver>.zip —— **只含 overlay** 的几十 KB 增量包，
        #     给「已经在用便携版桌面端」的人：解压覆盖到便携包根目录即可，不必重下 472MB
        #     （整包 97% 是每次发版都不变的 dsh 本体）。
        # 增量包的可行性依据在 scripts/package-plugin-update.mjs 头部：
        # 启动时 `applyRelease()` 不跑包管理器，只换 node_modules 下插件目录就能生效。
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          Write-Host "version: $version"
          node scripts/package-portable.mjs $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-plugin-update.mjs --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 按**确定的文件名**取，不用 `Get-ChildItem dist/*.zip | Select-Object -First 1`：
          # dist/ 里会同时躺着三种 zip（整包 / 插件便携包 / 增量包），`-First 1` 取到哪个
          # 纯看目录枚举顺序 —— 于是 sha256 有可能贴到另一个文件上，而 Release 附件还是对的
          # （本机 dist/ 实测有 9 个 zip）。取不到就直接失败，不静默放过。
          $pluginZip = Join-Path dist "dsh-webops-plugin-v$version-win-x64-portable.zip"
          $updateZip = Join-Path dist "dsh-webops-plugin-update-v$version.zip"
          foreach ($path in @($pluginZip, $updateZip)) {
            if (-not (Test-Path $path)) { throw "没打出预期的产物：$path" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_NAME=$(Split-Path -Leaf $pluginZip)"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_SHA256=$((Get-FileHash $pluginZip -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_ZIP_NAME=$(Split-Path -Leaf $updateZip)"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_ZIP_SHA256=$((Get-FileHash $updateZip -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_ZIP_KB=$([math]::Round((Get-Item $updateZip).Length / 1KB, 1))"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_VERSION=$version"
          Get-ChildItem dist/*.zip | Select-Object Name, Length

      - name: 写 release 说明
        shell: pwsh
        run: |
          # 单引号 here-string：内容不插值也不转义（反引号在双引号 here-string 里是转义符）。
          $notes = @'
          ## dsh-webops-plugin __TAG__

          为 DeepSeek Harness 增加客户端网页操作与调试能力的插件：browser_* 工具 +
          CDP provider + Electron 窗口 provider + 客户端观察面板。

          ### 先看该下哪个

          | 你现在的状态 | 下这个 | 大小 |
          | --- | --- | --- |
          | 已经在用旧版**便携版桌面端** | `__UPDATE_ZIP__` | __UPDATE_KB__ KB |
          | 自己有一份 dsh，想把插件装进去 | `__PLUGIN_ZIP__` | 见下表 |

          ### 增量包怎么用（几十 KB，不用重下整包）

          便携版整包 **472 MB 里 97% 是 dsh 本体**，每次发版完全不变，真正变化的只有插件那几个文件。
          所以从这一版起额外发一个只含插件 overlay 的增量包：

          1. 解压 `__UPDATE_ZIP__` 到**便携包根目录**（含 `app\` 与 `home\` 的那一层）
          2. 提示合并/覆盖时选「是」
          3. 重启桌面端

          它只替换 `home\profiles\desktop\node_modules\dsh-webops-plugin\` 下的文件，
          **不碰**你的会话、设置、凭据，也**不碰** `home\profiles\desktop\package.json`
          —— 那份 manifest 可能登记了你自己在插件管理器里装过的其它插件。

          生效判据：`home\profiles\desktop\node_modules\dsh-webops-plugin\package.json` 里的
          version 变成 `__VERSION__`；启动后输入框上方能看到「网页操作」状态条。

          ### 纯插件包怎么用

          解压到不含中文与空格的路径后执行：

              dsh plugin --profile <profile> add <解压目录>

          完整步骤与验证见包内 `INSTALL.md`。

          ### 产物

          | 文件 | 大小 | SHA-256 |
          | --- | --- | --- |
          | __PLUGIN_ZIP__ | — | __PLUGIN_SHA__ |
          | __UPDATE_ZIP__ | __UPDATE_KB__ KB | __UPDATE_SHA__ |
          '@
          $notes = $notes -replace '__TAG__', $env:TAG `
                           -replace '__VERSION__', $env:PLUGIN_VERSION `
                           -replace '__PLUGIN_ZIP__', $env:PLUGIN_ZIP_NAME `
                           -replace '__PLUGIN_SHA__', $env:PLUGIN_ZIP_SHA256 `
                           -replace '__UPDATE_ZIP__', $env:UPDATE_ZIP_NAME `
                           -replace '__UPDATE_KB__', $env:UPDATE_ZIP_KB `
                           -replace '__UPDATE_SHA__', $env:UPDATE_ZIP_SHA256
          $notes | Out-File -FilePath dist/notes.md -Encoding utf8

      - name: 发布 Release
        # **幂等**：理由同 `release-desktop.yml` 的同名步骤 —— `gh release create` 撞上
        # 「同名 Release 已存在」会 exit 1，哪怕这一步之前的构建全都成功了（症状极具误导性）。
        # 已存在时不新建，改为把终态对齐（覆盖两个附件 / 更新说明与标题 / 确保已发布）。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 显式列出两个附件，不用 `dist/*.zip` 通配 —— 万一以后 dist/ 里多出别的 zip，
          # 通配会把不相干的文件一起传上去。
          $pluginZip = Join-Path "$env:GITHUB_WORKSPACE\dist" "$env:PLUGIN_ZIP_NAME"
          $updateZip = Join-Path "$env:GITHUB_WORKSPACE\dist" "$env:UPDATE_ZIP_NAME"
          foreach ($f in @($pluginZip, $updateZip)) {
            if (-not (Test-Path $f)) { Write-Error "找不到待发布的产物：$f"; exit 1 }
          }

          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG 已存在 —— 覆盖上传产物并更新说明（不新建）。"
            gh release upload "$env:TAG" $pluginZip $updateZip --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit "$env:TAG" --title "$env:TAG" --notes-file dist/notes.md --draft=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "已对齐：附件为本次生成的两个 zip。"
          } else {
            gh release create "$env:TAG" --title "$env:TAG" --notes-file dist/notes.md $pluginZip $updateZip
          }

      - name: 收尾小结（无论成败都写）
        # 理由同 `release-desktop.yml` 的同名步骤：没有 `upload-artifact` ⇒ 失败的 run
        # 不留可下载产物，「红」容易被读成「什么都没出」。这里把两个附件的名字与大小写进
        # run 的 Summary，几 KB 就能把那个错觉消掉。
        if: always()
        shell: pwsh
        run: |
          $lines = @('## 产物与结论', '')
          $any = $false
          foreach ($name in @($env:PLUGIN_ZIP_NAME, $env:UPDATE_ZIP_NAME)) {
            if (-not $name) { continue }
            $f = Join-Path "$env:GITHUB_WORKSPACE\dist" $name
            if (Test-Path $f) {
              $item = Get-Item $f
              $lines += "- 产物已打好：$($item.Name)（$([math]::Round($item.Length / 1KB, 1)) KB）"
              $any = $true
            } else {
              $lines += "- ⚠️ 缺少产物：$name"
            }
          }
          if (-not $any) { $lines += "- 产物**没产出** —— 失败发生在打包之前，是真失败。" }
          else { $lines += "> 若这次 run 显示失败，先看**哪一步**红：只有末步「发布 Release」红才是发布动作的问题（见 docs/打包与发版.md §13）。" }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
