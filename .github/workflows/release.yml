name: release

# 发版流程：推 `v*` tag 即触发，产出 Windows x64 便携版 zip 并挂到 GitHub Release。
#
# 为什么必须在这里 clone deepseek-harness：本仓 devDependencies 里 13 个 dsh 包用的是
# pnpm 的 `link:../deepseek-harness/...`，指向**本机的 harness checkout**（README「接进
# dsh」有完整理由：npm 上的 dsh 包停在 0.0.1-rc.1，且 `@deepseek-ai/dsh-type-meta`
# 根本没发布）。所以 Actions 里不做这一步，`pnpm install` 必然失败。
#
# 也可以手动触发（Actions → Run workflow），用来补发某个已存在的 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（必须已推送到远端）
        required: true
        type: string
      harness_ref:
        description: deepseek-harness 的 ref（tag / branch / sha）
        required: false
        type: string

permissions:
  contents: write

env:
  # 默认 pin 到与本机 checkout 一致的提交，避免上游 main 漂移把构建搞挂。
  # 46a7f68b09 = tag `dsh-v0.1.7-rc.1`：与 `release-desktop.yml`
  # 用同一个 ref，也让本 workflow 的构建对着我们实际随包出货的那个 harness 版本。
  HARNESS_REF: ${{ inputs.harness_ref || '46a7f68b0922371ce7144b668b90e377d8e799f4' }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  portable-win-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 签出本仓
        uses: actions/checkout@v4

      - name: 装 pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 取 deepseek-harness 源码
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $PWD) 'deepseek-harness'
          Write-Host "harness ref: $env:HARNESS_REF → $dest"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Set-Location $dest
          git init --quiet
          git remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth 1 origin $env:HARNESS_REF
          git checkout --quiet FETCH_HEAD
          Get-Content package.json | Select-Object -First 3

      - name: 装 harness 的依赖
        # link 目标内部会 import 第三方包，而 pnpm 对 `link:` 依赖不装目标的依赖，
        # 得靠 harness 根自己的 node_modules 兜住解析。这一步失败不必然导致构建失败
        # （first-party 包在 tsdown 里是 external，多数情况不读源码），所以不阻断。
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        run: |
          Set-Location (Join-Path (Split-Path $PWD) 'deepseek-harness')
          pnpm install --ignore-scripts --no-frozen-lockfile

      - name: 装本仓依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 打插件便携包 + 增量更新包
        # 两个产物，面向两种用户：
        #   · dsh-webops-plugin-v<ver>-win-x64-portable.zip —— 纯插件包，走 `dsh plugin add`，
        #     给「自己有一份 dsh」的人；
        #   · dsh-webops-plugin-update-v<ver>.zip —— **只含 overlay** 的几十 KB 增量包，
        #     给「已经在用便携版桌面端」的人：解压覆盖到便携包根目录即可，不必重下 472MB
        #     （整包 97% 是每次发版都不变的 dsh 本体）。
        # 增量包的可行性依据在 scripts/package-plugin-update.mjs 头部：
        # 启动时 `applyRelease()` 不跑包管理器，只换 node_modules 下插件目录就能生效。
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          Write-Host "version: $version"
          node scripts/package-portable.mjs $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-plugin-update.mjs --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 按**确定的文件名**取，不用 `Get-ChildItem dist/*.zip | Select-Object -First 1`：
          # dist/ 里会同时躺着三种 zip（整包 / 插件便携包 / 增量包），`-First 1` 取到哪个
          # 纯看目录枚举顺序 —— 于是 sha256 有可能贴到另一个文件上，而 Release 附件还是对的
          # （本机 dist/ 实测有 9 个 zip）。取不到就直接失败，不静默放过。
          $pluginZip = Join-Path dist "dsh-webops-plugin-v$version-win-x64-portable.zip"
          $updateZip = Join-Path dist "dsh-webops-plugin-update-v$version.zip"
          foreach ($path in @($pluginZip, $updateZip)) {
            if (-not (Test-Path $path)) { throw "没打出预期的产物：$path" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_NAME=$(Split-Path -Leaf $pluginZip)"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_ZIP_SHA256=$((Get-FileHash $pluginZip -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_ZIP_NAME=$(Split-Path -Leaf $updateZip)"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_ZIP_SHA256=$((Get-FileHash $updateZip -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_ZIP_KB=$([math]::Round((Get-Item $updateZip).Length / 1KB, 1))"
          Add-Content -Path $env:GITHUB_ENV -Value "PLUGIN_VERSION=$version"
          Get-ChildItem dist/*.zip | Select-Object Name, Length

      - name: 写 release 说明
        shell: pwsh
        run: |
          # 单引号 here-string：内容不插值也不转义（反引号在双引号 here-string 里是转义符）。
          $notes = @'
          ## dsh-webops-plugin __TAG__

          为 DeepSeek Harness 增加客户端网页操作与调试能力的插件：browser_* 工具 +
          CDP provider + Electron 窗口 provider + 客户端观察面板。

          ### 先看该下哪个

          | 你现在的状态 | 下这个 | 大小 |
          | --- | --- | --- |
          | 已经在用旧版**便携版桌面端** | `__UPDATE_ZIP__` | __UPDATE_KB__ KB |
          | 自己有一份 dsh，想把插件装进去 | `__PLUGIN_ZIP__` | 见下表 |

          ### 增量包怎么用（几十 KB，不用重下整包）

          便携版整包 **472 MB 里 97% 是 dsh 本体**，每次发版完全不变，真正变化的只有插件那几个文件。
          所以从这一版起额外发一个只含插件 overlay 的增量包：

          1. 解压 `__UPDATE_ZIP__` 到**便携包根目录**（含 `app\` 与 `home\` 的那一层）
          2. 提示合并/覆盖时选「是」
          3. 重启桌面端

          它只替换 `home\profiles\desktop\node_modules\dsh-webops-plugin\` 下的文件，
          **不碰**你的会话、设置、凭据，也**不碰** `home\profiles\desktop\package.json`
          —— 那份 manifest 可能登记了你自己在插件管理器里装过的其它插件。

          生效判据：`home\profiles\desktop\node_modules\dsh-webops-plugin\package.json` 里的
          version 变成 `__VERSION__`；启动后输入框上方能看到「网页操作」状态条。

          ### 纯插件包怎么用

          解压到不含中文与空格的路径后执行：

              dsh plugin --profile <profile> add <解压目录>

          完整步骤与验证见包内 `INSTALL.md`。

          ### 产物

          | 文件 | 大小 | SHA-256 |
          | --- | --- | --- |
          | __PLUGIN_ZIP__ | — | __PLUGIN_SHA__ |
          | __UPDATE_ZIP__ | __UPDATE_KB__ KB | __UPDATE_SHA__ |
          '@
          $notes = $notes -replace '__TAG__', $env:TAG `
                           -replace '__VERSION__', $env:PLUGIN_VERSION `
                           -replace '__PLUGIN_ZIP__', $env:PLUGIN_ZIP_NAME `
                           -replace '__PLUGIN_SHA__', $env:PLUGIN_ZIP_SHA256 `
                           -replace '__UPDATE_ZIP__', $env:UPDATE_ZIP_NAME `
                           -replace '__UPDATE_KB__', $env:UPDATE_ZIP_KB `
                           -replace '__UPDATE_SHA__', $env:UPDATE_ZIP_SHA256
          $notes | Out-File -FilePath dist/notes.md -Encoding utf8

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 显式列出两个附件，不用 `dist/*.zip` 通配 —— 万一以后 dist/ 里多出别的 zip，
          # 通配会把不相干的文件一起传上去。
          $pluginZip = Join-Path dist "$env:PLUGIN_ZIP_NAME"
          $updateZip = Join-Path dist "$env:UPDATE_ZIP_NAME"
          gh release create "$env:TAG" `
            --title "$env:TAG" `
            --notes-file dist/notes.md `
            $pluginZip $updateZip
